packages:
  - apps/*
  - packages/*
  - tooling/*
  - infra/*
  - tools/*

catalog:
  "@faker-js/faker": ^10.5.0
  "@types/node": ^22.19.17
  babel-plugin-react-compiler: ^1.0.0
  esbuild: ^0.28.1
  eslint: ^9.39.4
  jose: ^5.10.0
  next: ^16.3.0
  obscenity: ^0.4.6
  prettier: ^3.9.6
  prettier-plugin-tailwindcss: ^0.8.1
  tailwindcss: ^4.3.3
  tsx: ^4.23.11
  typescript: ^5.9.3
  zod: ^3.25.76
  dotenv: ^17

catalogs:
  atproto:
    "@atproto/api": ^0.20.38
    "@atproto/jwk-jose": ^0.2.4
    "@atproto/oauth-client-expo": ^0.1.12
    "@atproto/oauth-client-node": ^0.5.3

  expo:
    "@expo/dom-webview": ~55.0.5
    "@expo/metro-runtime": ~55.0.10
    "@expo/vector-icons": ^15.1.1
    "@react-navigation/drawer": ^7.13.8
    "@react-navigation/native": ^7.3.16
    babel-preset-expo: ~55.0.19
    expo: ~55.0.19
    expo-constants: ~55.0.15
    expo-font: ~55.0.6
    expo-linking: ~55.0.14
    expo-router: ~55.0.13
    expo-secure-store: ~55.0.13
    expo-splash-screen: ~55.0.19
    expo-status-bar: ~55.0.5
    expo-system-ui: ~55.0.16
    jest-expo: ~55.0.16
    react-native: ~0.86.2
    react-native-gesture-handler: ^2.31.2
    react-native-reanimated: 4.5.3
    react-native-safe-area-context: ~5.8.1
    react-native-screens: ~4.27.0
    react-native-svg: 15.15.5
    react-native-url-polyfill: ^2.0.0
    react-native-web: ~0.21.2
    react-native-worklets: 0.11.3

  pkmn:
    "@pkmn/data": ^0.10.11
    "@pkmn/dex": ^0.10.7
    "@pkmn/img": ^0.3.4
    "@pkmn/sets": ^5.2.0
    "@pkmn/sim": ^0.10.11

  react:
    "@types/react": ~19.2
    "@types/react-dom": ~19.2.4
    react: 19.2.8
    react-dom: 19.2.8
    react-test-renderer: 19.2.8

  supabase:
    "@supabase/ssr": ^0.12.4
    "@supabase/supabase-js": ^2.112.2
    # Pinned EXACT (no caret): the CLI version determines the bundled
    # supabase/postgres image tag AND whether `gen types --local` works offline.
    # 2.106.0 pulls image .063 (supabase_admin needs a password) and its `gen
    # types` requires a platform token even locally (LegacyPlatformAuthRequired).
    # Pin to a specific version — controls the supabase/postgres Docker image tag
    # pulled for local dev. Verify trust auth + offline type generation with a
    # fresh `db:reset` after bumping.
    supabase: 2.113.0

  tamagui:
    "@tamagui/config": 2.7.3
    "@tamagui/web": 2.7.3
    tamagui: 2.7.3

  tanstack:
    "@tanstack/react-query": ^5.101.4

  testing:
    "@jest/globals": ^29.7.0
    "@testing-library/jest-dom": ^6.9.1
    "@testing-library/react": ^16.3.2
    "@testing-library/react-native": ^13.3.3
    "@testing-library/user-event": ^14.6.3
    "@types/jest": ^29.5.14
    jest: ^29.7.0
    jest-environment-jsdom: ^29.7.0
    jest-junit: ^17.0.0
    ts-jest: ^29.4.9
    ts-node: ^10.9.2

allowBuilds:
  browser-tabs-lock: true
  bufferutil: true
  core-js: true
  esbuild: true
  msw: true
  sharp: true
  supabase: true
  utf-8-validate: true
  "@nestjs/core": true
  "@swc/core": true
  cbor-extract: true
  protobufjs: true
